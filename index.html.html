<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reel Bench – Video Editor</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#e4e7ec;--panel:#f4f5f7;--line:#cdd1d9;--ink:#1a1d24;--mute:#667085;--acc:#e8465f;--vid:#5b6cff;--aud:#1f9d84;--txt:#c98a12;--field:#e9ebef;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12141a;--panel:#1b1e25;--line:#2a2e38;--ink:#e8e6e1;--mute:#8b92a1;--acc:#ff5d73;--vid:#6b79ff;--aud:#2fb59a;--txt:#e0a33a;--field:#262a33;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12141a;--panel:#1b1e25;--line:#2a2e38;--ink:#e8e6e1;--mute:#8b92a1;--acc:#ff5d73;--vid:#6b79ff;--aud:#2fb59a;--txt:#e0a33a;--field:#262a33;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 "Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px 11px;cursor:pointer}
button:hover:not(:disabled){border-color:var(--mute)}
button:disabled{opacity:.45;cursor:default}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) 292px}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0;font-weight:700;letter-spacing:-.01em}
header .sp{flex:1}
main{display:grid;grid-template-columns:250px minmax(0,1fr) 270px;min-height:0}
aside{background:var(--panel);overflow:auto;padding:12px;min-height:0}
aside.l{border-right:1px solid var(--line)}aside.r{border-left:1px solid var(--line)}
aside h2{font-size:13px;margin:0 0 10px;font-weight:600}
.stage{display:flex;flex-direction:column;min-height:0;padding:12px;gap:10px}
.cvw{flex:1;min-height:0;display:grid;place-items:center;position:relative}
canvas{max-width:100%;max-height:100%;background:#000;border-radius:6px;display:block}
.empty{position:absolute;inset:0;display:grid;place-content:center;gap:10px;text-align:center;color:#ddd;pointer-events:none}
.empty button{pointer-events:auto}
.tp{display:flex;gap:10px;align-items:center}
.tp input[type=range]{flex:1;accent-color:var(--acc)}
.tp output{font-variant-numeric:tabular-nums;color:var(--mute);min-width:150px;text-align:right}
.mi{display:grid;grid-template-columns:54px 1fr auto;gap:8px;align-items:center;padding:6px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:grab;background:var(--bg)}
.mi video,.mi img,.mi .note{width:54px;height:36px;object-fit:cover;border-radius:4px;background:#000}
.mi .note{display:grid;place-items:center;color:var(--aud);font-size:20px;background:var(--field)}
.mi b{display:block;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100px}
.mi small{color:var(--mute)}
.hint{color:var(--mute);font-size:13px}
.fld{display:grid;grid-template-columns:78px 1fr 40px;gap:6px;align-items:center;margin-bottom:6px}
.fld span{color:var(--mute);font-size:13px}.fld output{font-size:12px;text-align:right;font-variant-numeric:tabular-nums}
.fld input[type=range]{width:100%;accent-color:var(--acc)}
textarea{width:100%;min-height:64px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:6px;resize:vertical;margin-bottom:8px}
.grp{border-top:1px solid var(--line);margin-top:10px;padding-top:10px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}.btns button{padding:4px 8px;font-size:12px}
select{width:100%;background:var(--field);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:4px}
.tl{display:grid;grid-template-columns:78px minmax(0,1fr);background:var(--panel);border-top:1px solid var(--line);min-height:0}
.lab{border-right:1px solid var(--line);padding-top:26px}
.lab div{height:48px;display:flex;align-items:center;padding-left:10px;color:var(--mute);font-size:13px;border-bottom:1px solid var(--line)}
.tls{overflow:auto;position:relative}
.inner{position:relative;min-height:100%}
.ruler{height:26px;border-bottom:1px solid var(--line);position:relative;cursor:ew-resize;user-select:none}
.ruler i{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-style:normal;font-size:11px;color:var(--mute);padding-left:4px;line-height:26px}
.row{height:48px;border-bottom:1px solid var(--line);position:relative}
.row.over{background:color-mix(in srgb,var(--acc) 10%,transparent)}
.clip{position:absolute;top:4px;bottom:4px;border-radius:6px;overflow:hidden;color:#fff;font-size:12px;padding:0 10px;display:flex;align-items:center;cursor:grab;user-select:none;touch-action:none;border:2px solid transparent}
.clip.video,.clip.image{background:var(--vid)}.clip.audio{background:var(--aud)}.clip.text{background:var(--txt)}
.clip.on{border-color:#fff;box-shadow:0 0 0 2px var(--acc)}
.clip span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.clip .h{position:absolute;top:0;bottom:0;width:8px;cursor:col-resize;background:rgba(255,255,255,.35)}
.h.l{left:0}.h.r{right:0}
.ph{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--acc);pointer-events:none;z-index:5}
.ph::before{content:"";position:absolute;top:0;left:-7px;border:6px solid transparent;border-top:9px solid var(--acc)}
.busy{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-content:center;gap:10px;text-align:center;color:#fff;z-index:20}
.bar{width:260px;height:8px;border-radius:4px;background:#fff3;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
@media (max-width:900px){
 body{overflow:auto}
 #app{height:auto;min-height:100%;grid-template-rows:auto auto 292px}
 main{grid-template-columns:1fr}
 aside{max-height:230px}aside.l,aside.r{border:0;border-bottom:1px solid var(--line)}
 .stage{height:340px}
}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/htm@3.1.1/dist/htm.umd.js"></script>
<script>
const {useState,useRef,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const W=1280,H=720,TH=48,TRACKS=['Overlay','Video','Audio'];
const DEF={x:0,y:0,scale:1,opacity:1,volume:1,brightness:1,contrast:1,saturate:1,gray:0,blur:0,fade:0,rot:0,fx:1,fy:1,sepia:0,hue:0,invert:0,vig:0,grain:0,pix:0,sp:1,sp2:1,tin:'none',tout:'none',td:.6};
const srcT=(c,t)=>{const u=clamp(t-c.start,0,c.dur);return c.in+c.sp*u+(c.sp2-c.sp)*u*u/(2*c.dur)};
const spAt=(c,t)=>c.sp+(c.sp2-c.sp)*clamp((t-c.start)/c.dur,0,1);
const TRANS=['none','fade','slide left','slide right','slide up','slide down','zoom','spin','wipe','blur'];
const trn=(y,k)=>{const r={a:1,x:0,y:0,s:1,r:0,b:0,w:1},j=1-k;
 if(y==='fade')r.a=k;else if(y==='slide left')r.x=-W*j;else if(y==='slide right')r.x=W*j;else if(y==='slide up')r.y=-H*j;else if(y==='slide down')r.y=H*j;
 else if(y==='zoom'){r.s=.5+.5*k;r.a=k}else if(y==='spin'){r.r=-Math.PI*j;r.s=.4+.6*k;r.a=k}else if(y==='wipe')r.w=k;else if(y==='blur'){r.b=20*j;r.a=k}
 return r};
const LOOKS={Vivid:{saturate:1.5,contrast:1.15},Noir:{gray:1,contrast:1.3,vig:.5},Warm:{sepia:.3,saturate:1.2,brightness:1.05},Cool:{hue:-15,saturate:.9,brightness:1.03},Vintage:{sepia:.6,contrast:.9,grain:.5,vig:.4},Clean:{brightness:1,contrast:1,saturate:1,gray:0,sepia:0,hue:0,invert:0,vig:0,grain:0,blur:0,pix:0}};
const noise=(()=>{const n=document.createElement('canvas');n.width=n.height=128;const x=n.getContext('2d'),i=x.createImageData(128,128);for(let k=0;k<i.data.length;k+=4){const v=Math.random()*255;i.data[k]=i.data[k+1]=i.data[k+2]=v;i.data[k+3]=255}x.putImageData(i,0,0);return n})();
const tmp=document.createElement('canvas');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
let uid=1;const nid=()=>'i'+(uid++);
const fmt=t=>{t=Math.max(0,t);const m=Math.floor(t/60),s=Math.floor(t%60),f=Math.floor((t%1)*30);const p=n=>String(n).padStart(2,'0');return `${p(m)}:${p(s)}:${p(f)}`};
const push=s=>[...s.past.slice(-50),s.clips];

function reducer(s,a){switch(a.t){
 case'media':return{...s,media:[...s.media,a.m]};
 case'snap':return{...s,past:push(s)};
 case'undo':return s.past.length?{...s,clips:s.past[s.past.length-1],past:s.past.slice(0,-1),sel:null}:s;
 case'set':return{...s,clips:s.clips.map(c=>c.id===a.id?{...c,...a.p}:c)};
 case'add':return{...s,past:push(s),clips:[...s.clips,a.c],sel:a.c.id};
 case'del':return s.sel?{...s,past:push(s),clips:s.clips.filter(c=>c.id!==s.sel),sel:null}:s;
 case'sel':return{...s,sel:a.id};
 case'split':{const t=a.time,ok=c=>t>c.start+.05&&t<c.start+c.dur-.05;
  const c=s.clips.find(c=>c.id===s.sel&&ok(c))||s.clips.filter(ok).sort((x,y)=>x.track-y.track)[0];
  if(!c)return s;const d=t-c.start,sp=spAt(c,t),n={...c,id:nid(),start:t,in:srcT(c,t),dur:c.dur-d,sp,tin:'none'};
  return{...s,past:push(s),clips:s.clips.map(x=>x.id===c.id?{...x,dur:d,sp2:sp,tout:'none'}:x).concat(n),sel:n.id}}
 case'dup':{const c=s.clips.find(c=>c.id===s.sel);if(!c)return s;const n={...c,id:nid(),start:c.start+c.dur};return{...s,past:push(s),clips:[...s.clips,n],sel:n.id}}
 default:return s}}

function App(){
 const [s,d]=React.useReducer(reducer,{media:[],clips:[],sel:null,past:[]});
 const [time,setTime]=useState(0),[playing,setPlaying]=useState(false),[zoom,setZoom]=useState(70),[exp,setExp]=useState(false);
 const cv=useRef(),inner=useRef(),rows=useRef(),file=useRef();
 const els=useRef({}),au=useRef({}),T=useRef(0),R=useRef({}),rec=useRef(null),lastSnap=useRef(0);
 const [over,setOver]=useState(-1);
 const end=useMemo(()=>Math.max(0,...s.clips.map(c=>c.start+c.dur)),[s.clips]);
 const mm=useMemo(()=>Object.fromEntries(s.media.map(m=>[m.id,m])),[s.media]);
 R.current={s,playing,end,mm};
 const sel=s.clips.find(c=>c.id===s.sel);

 const ensure=()=>{if(!au.current.c){const c=new(window.AudioContext||window.webkitAudioContext)();au.current={c,d:c.createMediaStreamDestination()}}return au.current};
 const getEl=c=>{
  if(els.current[c.id])return els.current[c.id];
  const m=R.current.mm[c.mediaId];if(!m)return null;let e;
  if(m.type==='image'){e=new Image();e.src=m.url}
  else{e=document.createElement(m.type);e.src=m.url;e.preload='auto';e.playsInline=true;
   try{const a=ensure(),src=a.c.createMediaElementSource(e);src.connect(a.d);src.connect(a.c.destination)}catch(x){}}
  return els.current[c.id]=e};
 const fade=(c,t)=>c.fade>0?clamp(Math.min((t-c.start)/c.fade,(c.start+c.dur-t)/c.fade),0,1):1;

 const render=(cx,t,clips,play)=>{
  cx.filter='none';cx.globalAlpha=1;cx.shadowBlur=0;cx.fillStyle='#000';cx.fillRect(0,0,W,H);
  const act=clips.filter(c=>t>=c.start&&t<c.start+c.dur),live=new Set();
  for(const c of act){if(c.type==='text')continue;live.add(c.id);
   const e=getEl(c);if(!e||c.type==='image')continue;const lt=srcT(c,t);e.playbackRate=clamp(spAt(c,t),.0625,16);
   if(play){if(e.paused)e.play().catch(()=>{});if(Math.abs(e.currentTime-lt)>.3)e.currentTime=lt}
   else{if(!e.paused)e.pause();if(Math.abs(e.currentTime-lt)>.04)e.currentTime=lt}
   e.volume=clamp(c.volume*fade(c,t),0,1)}
  for(const id in els.current){const e=els.current[id];if(!live.has(id)&&e.pause&&!e.paused)e.pause()}
  for(const tr of[1,0])for(const c of act.filter(c=>c.track===tr)){
   cx.save();const ti=trn(c.tin,clamp((t-c.start)/c.td,0,1)),to=trn(c.tout,clamp((c.start+c.dur-t)/c.td,0,1)),wk=ti.w*to.w;
   if(wk<1){cx.beginPath();cx.rect(0,0,W*wk,H);cx.clip()}
   cx.globalAlpha=clamp(c.opacity*fade(c,t)*ti.a*to.a,0,1);
   cx.translate(W/2+c.x/100*W+ti.x+to.x,H/2+c.y/100*H+ti.y+to.y);cx.rotate(c.rot*Math.PI/180+ti.r+to.r);cx.scale(c.scale*ti.s*to.s*c.fx,c.scale*ti.s*to.s*c.fy);
   if(c.type==='text'){const z=c.size,ls=c.text.split('\n');
    cx.font=`700 ${z}px "Instrument Sans",system-ui,sans-serif`;cx.textAlign='center';cx.textBaseline='middle';
    cx.fillStyle=c.color;cx.shadowColor='rgba(0,0,0,.55)';cx.shadowBlur=z/6;
    ls.forEach((l,i)=>cx.fillText(l,0,(i-(ls.length-1)/2)*z*1.2))}
   else if(c.type!=='audio'){const e=els.current[c.id];if(e){
    const iw=e.videoWidth||e.naturalWidth,ih=e.videoHeight||e.naturalHeight;
    if(iw&&ih){const k=Math.min(W/iw,H/ih),dw=iw*k,dh=ih*k;
     cx.filter=`brightness(${c.brightness}) contrast(${c.contrast}) saturate(${c.saturate}) grayscale(${c.gray}) sepia(${c.sepia}) hue-rotate(${c.hue}deg) invert(${c.invert}) blur(${c.blur+ti.b+to.b}px)`;
     try{if(c.pix>0){const p=1+c.pix,w2=Math.max(1,dw/p|0),h2=Math.max(1,dh/p|0);tmp.width=w2;tmp.height=h2;tmp.getContext('2d').drawImage(e,0,0,w2,h2);cx.imageSmoothingEnabled=false;cx.drawImage(tmp,-dw/2,-dh/2,dw,dh)}else cx.drawImage(e,-dw/2,-dh/2,dw,dh)}catch(x){}}}}
   cx.restore();
   if(c.vig>0||c.grain>0){cx.save();cx.globalAlpha=clamp(fade(c,t)*ti.a*to.a,0,1);
    if(c.vig>0){const g=cx.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.62);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,`rgba(0,0,0,${c.vig})`);cx.fillStyle=g;cx.fillRect(0,0,W,H)}
    if(c.grain>0){cx.globalAlpha*=c.grain*.35;cx.translate(Math.random()*128,Math.random()*128);cx.fillStyle=cx.createPattern(noise,'repeat');cx.fillRect(-128,-128,W+128,H+128)}
    cx.restore()}}};

 useEffect(()=>{
  const cx=cv.current.getContext('2d');let raf,last=performance.now();
  const frame=now=>{
   const dt=Math.min(.1,(now-last)/1000);last=now;let t=T.current;
   if(R.current.playing){t+=dt;
    if(t>=R.current.end){t=R.current.end;R.current.playing=false;setPlaying(false);
     const r=rec.current;rec.current=null;if(r)setTimeout(()=>r.stop(),250)}
    T.current=t;setTime(t)}
   render(cx,t,R.current.s.clips,R.current.playing);
   raf=requestAnimationFrame(frame)};
  raf=requestAnimationFrame(frame);return()=>cancelAnimationFrame(raf)},[]);

 const seek=t=>{T.current=clamp(t,0,R.current.end);setTime(T.current)};
 const play=async()=>{if(!R.current.end)return;const a=ensure();await a.c.resume();if(T.current>=R.current.end-.01)seek(0);R.current.playing=true;setPlaying(true)};
 const pause=()=>{R.current.playing=false;setPlaying(false)};

 useEffect(()=>{const k=e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)&&e.target.type!=='range')return;
  if(e.code==='Space'){e.preventDefault();playing?pause():play()}
  else if(e.key==='s'||e.key==='S')d({t:'split',time:T.current})
  else if(e.key==='Delete'||e.key==='Backspace')d({t:'del'})
  else if((e.ctrlKey||e.metaKey)&&e.key==='z'){e.preventDefault();d({t:'undo'})}
  else if(e.key==='ArrowLeft')seek(T.current-1/30)
  else if(e.key==='ArrowRight')seek(T.current+1/30)};
  window.addEventListener('keydown',k);return()=>window.removeEventListener('keydown',k)});

 const imp=files=>[...files].forEach(f=>{
  const type=f.type.startsWith('video')?'video':f.type.startsWith('audio')?'audio':f.type.startsWith('image')?'image':null;if(!type)return;
  const m={id:nid(),name:f.name,type,url:URL.createObjectURL(f),duration:5};
  if(type==='image')d({t:'media',m});
  else{const e=document.createElement(type);e.preload='metadata';e.onloadedmetadata=()=>d({t:'media',m:{...m,duration:e.duration||5}});e.src=m.url}});
 const place=(m,start=T.current,track)=>d({t:'add',c:{...DEF,id:nid(),mediaId:m.id,type:m.type,track:track??(m.type==='audio'?2:1),start,in:0,dur:m.duration}});
 const addText=()=>d({t:'add',c:{...DEF,id:nid(),type:'text',track:0,start:T.current,in:0,dur:4,text:'Your title',size:72,color:'#ffffff'}});
 const U=p=>{if(Date.now()-lastSnap.current>700){d({t:'snap'});lastSnap.current=Date.now()}d({t:'set',id:sel.id,p})};

 const snapT=(v,id,len)=>{const pts=[T.current,...R.current.s.clips.filter(x=>x.id!==id).flatMap(x=>[x.start,x.start+x.dur])];
  let best=v,bd=8/zoom;for(const p of pts)for(const c of[p,p-len]){const e=Math.abs(c-v);if(e<bd){bd=e;best=c}}return Math.max(0,best)};
 const drag=(e,c,mode)=>{
  e.stopPropagation();e.preventDefault();d({t:'sel',id:c.id});d({t:'snap'});
  const x0=e.clientX,o={...c},m=mm[c.mediaId],av=c.type==='video'||c.type==='audio',max=av&&m?m.duration:Infinity;
  const mv=ev=>{const dx=(ev.clientX-x0)/zoom;let p;
   if(mode==='move'){const st=snapT(Math.max(0,o.start+dx),c.id,o.dur),r=rows.current.getBoundingClientRect();
    const row=clamp(Math.floor((ev.clientY-r.top)/TH),0,2),ok=c.type==='audio'?row===2:row<2;p={start:st,track:ok?row:o.track}}
   else if(mode==='l'){let dd=snapT(Math.max(0,o.start+dx),c.id,0)-o.start;dd=clamp(dd,av?-Math.min(o.start,o.in/Math.max(o.sp,.1)):-o.start,o.dur-.1);p={start:o.start+dd,in:o.in+o.sp*dd+(o.sp2-o.sp)*dd*dd/(2*o.dur),dur:o.dur-dd,sp:o.sp+(o.sp2-o.sp)*dd/o.dur}}
   else p={dur:clamp(snapT(o.start+o.dur+dx,c.id,0)-o.start,.1,(max-(av?o.in:0))/((o.sp+o.sp2)/2))};
   d({t:'set',id:c.id,p})};
  const up=()=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up)};
 const scrub=e=>{if(e.target.closest('.clip'))return;if(e.currentTarget.className==='row')d({t:'sel',id:null});
  const at=ev=>seek((ev.clientX-inner.current.getBoundingClientRect().left)/zoom);at(e);
  const up=()=>{window.removeEventListener('pointermove',at);window.removeEventListener('pointerup',up)};
  window.addEventListener('pointermove',at);window.addEventListener('pointerup',up)};
 const drop=(e,i)=>{e.preventDefault();setOver(-1);const m=mm[e.dataTransfer.getData('text/plain')];if(!m)return;
  if((m.type==='audio')!==(i===2))return;place(m,Math.max(0,(e.clientX-inner.current.getBoundingClientRect().left)/zoom),i)};

 const exportV=async()=>{
  if(!end||exp)return;if(!window.MediaRecorder){alert('This browser can’t record video. Try Chrome, Edge or Firefox.');return}
  const a=ensure();await a.c.resume();const cs=cv.current.captureStream(30);a.d.stream.getAudioTracks().forEach(t=>cs.addTrack(t));
  const mime=['video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));
  const ch=[],r=new MediaRecorder(cs,{mimeType:mime,videoBitsPerSecond:8e6});
  r.ondataavailable=ev=>ev.data.size&&ch.push(ev.data);
  r.onstop=()=>{const l=document.createElement('a');l.href=URL.createObjectURL(new Blob(ch,{type:'video/webm'}));l.download='reel-bench-export.webm';l.click();setExp(false)};
  rec.current=r;setExp(true);seek(0);r.start(250);R.current.playing=true;setPlaying(true)};

 const SP=p=>{const n={...sel,...p};U({...p,dur:Math.max(.1,((sel.sp+sel.sp2)/2*sel.dur)/((n.sp+n.sp2)/2))})};
 const Sp=(l,k)=>html`<label className="fld"><span>${l}</span><input type="range" min="0.1" max="4" step="0.05" value=${sel[k]} onChange=${e=>SP({[k]:+e.target.value})}/><output>${sel[k].toFixed(2)}x</output></label>`;
 const Sl=(l,k,a,b,st)=>html`<label className="fld"><span>${l}</span><input type="range" min=${a} max=${b} step=${st} value=${sel[k]} onChange=${e=>U({[k]:+e.target.value})}/><output>${(+sel[k]).toFixed(2)}</output></label>`;
 const step=zoom>=110?1:zoom>=55?2:5,tw=Math.max(end+10,30)*zoom,ticks=[];
 for(let i=0;i*step*zoom<tw;i++)ticks.push(i*step);
 const label=c=>c.type==='text'?c.text.split('\n')[0]:(mm[c.mediaId]||{}).name;

 return html`<div id="app">
  <header>
   <h1>Reel Bench</h1>
   <input ref=${file} type="file" accept="video/*,audio/*,image/*" multiple hidden onChange=${e=>{imp(e.target.files);e.target.value=''}}/>
   <button onClick=${()=>file.current.click()}>Import media</button>
   <button onClick=${addText}>Add text</button>
   <button onClick=${()=>d({t:'split',time:T.current})} disabled=${!s.clips.length}>Split at playhead</button>
   <button onClick=${()=>d({t:'dup'})} disabled=${!sel}>Duplicate</button>
   <button onClick=${()=>d({t:'del'})} disabled=${!sel}>Delete clip</button>
   <button onClick=${()=>d({t:'undo'})} disabled=${!s.past.length}>Undo</button>
   <span className="sp"></span>
   <label className="hint">Zoom <input type="range" min="20" max="200" value=${zoom} onChange=${e=>setZoom(+e.target.value)}/></label>
   <button className="pri" onClick=${exportV} disabled=${!end||exp}>Export WebM</button>
  </header>
  <main>
   <aside className="l"><h2>Media</h2>
    ${!s.media.length&&html`<p className="hint">Import videos, audio or images. Drag a file onto a track, or press Add.</p>`}
    ${s.media.map(m=>html`<div key=${m.id} className="mi" draggable="true" onDragStart=${e=>e.dataTransfer.setData('text/plain',m.id)} onDoubleClick=${()=>place(m)}>
      ${m.type==='video'?html`<video src=${m.url+'#t=0.5'} muted preload="metadata"></video>`:m.type==='image'?html`<img src=${m.url} alt=""/>`:html`<div className="note">♪</div>`}
      <div><b title=${m.name}>${m.name}</b><small>${m.type}, ${m.duration.toFixed(1)}s</small></div>
      <button onClick=${()=>place(m)}>Add</button></div>`)}
   </aside>
   <section className="stage">
    <div className="cvw"><canvas ref=${cv} width=${W} height=${H}></canvas>
     ${!s.clips.length&&html`<div className="empty"><b>Your preview appears here</b><span>Import a clip, then add it to the timeline.</span><button onClick=${()=>file.current.click()}>Import media</button></div>`}</div>
    <div className="tp">
     <button onClick=${()=>playing?pause():play()} disabled=${!end} style=${{minWidth:70}}>${playing?'Pause':'Play'}</button>
     <button onClick=${()=>seek(0)}>Start</button>
     <input type="range" min="0" max=${end||1} step="0.01" value=${time} onChange=${e=>seek(+e.target.value)} aria-label="Scrub"/>
     <output>${fmt(time)} / ${fmt(end)}</output>
    </div>
   </section>
   <aside className="r"><h2>${sel?(sel.type==='text'?'Text clip':label(sel)):'Inspector'}</h2>
    ${!sel&&html`<p className="hint">Select a clip on the timeline to edit it.</p><p className="hint">Space plays and pauses. S splits at the playhead. Delete removes the clip. Ctrl+Z undoes. Arrow keys step one frame.</p>`}
    ${sel&&sel.type==='text'&&html`<textarea value=${sel.text} onChange=${e=>U({text:e.target.value})}></textarea>
     <label className="fld"><span>Color</span><input type="color" value=${sel.color} onChange=${e=>U({color:e.target.value})}/><output></output></label>
     ${Sl('Size','size',16,200,1)}`}
    ${sel&&sel.type!=='audio'&&html`${Sl('Scale','scale',.1,3,.01)}${Sl('Left / right','x',-60,60,.5)}${Sl('Up / down','y',-60,60,.5)}${Sl('Opacity','opacity',0,1,.01)}${Sl('Rotate','rot',-180,180,1)}<div className="btns"><button onClick=${()=>U({fx:-sel.fx})}>Flip horizontal</button><button onClick=${()=>U({fy:-sel.fy})}>Flip vertical</button></div>`}
    ${sel&&(sel.type==='video'||sel.type==='audio')&&Sl('Volume','volume',0,1,.01)}
    ${sel&&html`${Sl('Fade in/out','fade',0,3,.1)}
    <div className="grp"><h2>Transitions</h2>
     <label className="fld"><span>In</span><select value=${sel.tin} onChange=${e=>U({tin:e.target.value})}>${TRANS.map(x=>html`<option key=${x}>${x}</option>`)}</select><output></output></label>
     <label className="fld"><span>Out</span><select value=${sel.tout} onChange=${e=>U({tout:e.target.value})}>${TRANS.map(x=>html`<option key=${x}>${x}</option>`)}</select><output></output></label>
     ${Sl('Length','td',.1,2,.05)}
     <p className="hint">For a cross-dissolve, overlap two clips on one track and give both a fade transition.</p></div>
    ${(sel.type==='video'||sel.type==='audio')&&html`<div className="grp"><h2>Speed and ramping</h2>${Sp('Speed','sp')}${Sp('Ramp to','sp2')}
     <div className="btns">${[['0.5x',.5,.5],['2x',2,2],['Slow-mo ramp',1,.25],['Speed-up ramp',1,3],['Reset',1,1]].map(([n,a,b])=>html`<button key=${n} onClick=${()=>SP({sp:a,sp2:b})}>${n}</button>`)}</div></div>`}`}
    ${sel&&(sel.type==='video'||sel.type==='image')&&html`<div className="grp">${Sl('Brightness','brightness',0,2,.01)}${Sl('Contrast','contrast',0,2,.01)}${Sl('Saturation','saturate',0,3,.01)}${Sl('Grayscale','gray',0,1,.01)}${Sl('Blur','blur',0,20,.5)}${Sl('Sepia','sepia',0,1,.01)}${Sl('Hue','hue',-180,180,1)}${Sl('Invert','invert',0,1,.01)}${Sl('Vignette','vig',0,1,.01)}${Sl('Film grain','grain',0,1,.01)}${Sl('Pixelate','pix',0,40,1)}<div className="btns">${Object.keys(LOOKS).map(n=>html`<button key=${n} onClick=${()=>U(LOOKS[n])}>${n}</button>`)}</div></div>`}
    ${sel&&html`<p className="hint">Starts at ${fmt(sel.start)}, lasts ${sel.dur.toFixed(2)}s</p>`}
   </aside>
  </main>
  <div className="tl">
   <div className="lab">${TRACKS.map(n=>html`<div key=${n}>${n}</div>`)}</div>
   <div className="tls"><div className="inner" ref=${inner} style=${{width:tw}}>
    <div className="ruler" onPointerDown=${scrub}>${ticks.map(t=>html`<i key=${t} style=${{left:t*zoom}}>${t}s</i>`)}</div>
    <div ref=${rows}>${TRACKS.map((n,i)=>html`<div key=${n} className=${'row'+(over===i?' over':'')} onPointerDown=${scrub} onDragOver=${e=>{e.preventDefault();setOver(i)}} onDragLeave=${()=>setOver(-1)} onDrop=${e=>drop(e,i)}>
      ${s.clips.filter(c=>c.track===i).map(c=>html`<div key=${c.id} className=${'clip '+c.type+(s.sel===c.id?' on':'')} style=${{left:c.start*zoom,width:Math.max(6,c.dur*zoom)}} onPointerDown=${e=>drag(e,c,'move')}>
        <i className="h l" onPointerDown=${e=>drag(e,c,'l')}></i><span>${label(c)}</span><i className="h r" onPointerDown=${e=>drag(e,c,'r')}></i></div>`)}
     </div>`)}</div>
    <div className="ph" style=${{left:time*zoom}}></div>
   </div></div>
  </div>
  ${exp&&html`<div className="busy"><b>Exporting your video</b><span>It records in real time, so keep this tab open.</span><div className="bar"><i style=${{width:(end?time/end*100:0)+'%'}}></i></div></div>`}
 </div>`}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
